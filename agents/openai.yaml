interface:
  display_name: "Chat Requirement Daily Intake"
  short_description: "Extract daily work items, meeting decisions, follow-ups, reminders, and product requirements from authorized chat exports."
  default_prompt: "Use $chat-requirement-daily-intake only on the configured and authorized data scope. Validate config.yaml and permissions first, generate a read-only daily intake report, separate decisions/reminders/tasks/product requirements, and write to a destination only when the configured write policy explicitly allows it and the item is verified."

policy:
  # This skill may eventually write to external work-management systems.
  # Require explicit invocation so normal conversations cannot trigger it accidentally.
  allow_implicit_invocation: false
